apiVersion: apps/v1
kind: Deployment
metadata:
  name: vortex
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vortex
  template:
    metadata:
      labels:
        app: vortex
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: vortex
          image: ghcr.io/orpheustelos7/vortex:latest
          ports:
            - containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: ETCD_ENDPOINTS
              value: "etcd:2379"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: vortex
spec:
  selector:
    app: vortex
  ports:
    - name: http
      port: 80
      targetPort: 8080
